name: Setup Flutter Build Environment
description: Common setup steps for all platform builds

inputs:
  version:
    description: "Tag name for git metadata"
    required: false
    default: ""

outputs:
  GIT_TAG:
    description: "Git tag"
    value: ${{ steps.git_meta.outputs.GIT_TAG }}
  GIT_COMMIT:
    description: "Git commit hash"
    value: ${{ steps.git_meta.outputs.GIT_COMMIT }}
  GIT_COMMIT_DATE:
    description: "Git commit date"
    value: ${{ steps.git_meta.outputs.GIT_COMMIT_DATE }}

runs:
  using: composite
  steps:
    - name: Fetch all tags
      run: git fetch --tags --force
      shell: bash

    - uses: subosito/flutter-action@v2.18.0
      with:
        flutter-version: "3.44.9"
        channel: "stable"
        cache: true

    - name: Mark Flutter SDK as safe for git
      run: git config --global --add safe.directory "$FLUTTER_ROOT"
      shell: bash

    - name: Enable git long paths (Windows)
      # flutter_inappwebview 的 fork 源码树很深：pub 把 git 依赖检出到 pub cache 后，
      # flutter_inappwebview_android 里最深的文件路径超过 Windows 的 260 字符
      # MAX_PATH（默认 pub cache 根下实测 268 字符）。不开长路径时 checkout 会中途
      # 失败，pub 随后把整组子包判为「不再被依赖」，flutter 工具的 package_graph
      # 校验再以缺包报错，表现为 setup 阶段 `flutter pub get` 退出码 1。
      if: runner.os == 'Windows'
      run: git config --global core.longpaths true
      shell: bash

    - name: Get dependencies
      run: flutter pub get
      shell: bash
      # 提交的 pubspec.lock 锁定的是国内镜像：不设 PUB_HOSTED_URL 时 pub get 会把
      # lock 全量翻成 pub.dev，造成「生成物漂移」假失败（三个调用方共用本 action，
      # 在此统一设置；build-android 自身的 job 级 env 与此处取值相同，保留无妨）。
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn

    - name: Set up Python 3
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    - name: Extract git metadata
      id: git_meta
      run: python .github/scripts/git_meta.py
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GITHUB_REF_NAME: ${{ github.ref_name }}

    - name: Generate code
      run: dart run build_runner build --delete-conflicting-outputs || true
      shell: bash

    - name: Generate localizations
      run: flutter gen-l10n
      shell: bash
